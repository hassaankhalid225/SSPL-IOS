#Gradle
org.gradle.jvmargs=-Xmx7g -XX:+UseG1GC -Dfile.encoding=UTF-8 -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000
kotlin.daemon.jvm.options=-Xmx7g
kotlin.native.jvmArgs=-Xmx7g -XX:+UseG1GC
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true




#remove if using mac-------disabling warnings for ios built failure on window laptop
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.androidGradlePluginCompatibilityNoWarn=true
